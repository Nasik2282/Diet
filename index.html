<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriPilot</title>
<style>:root{--red:#ef3b4f;--ink:#2b2433;--mu:#8b8394;--gr:#34c38f;--sky:#5ab8f0;--or:#ffb347;--pk:#ffd9df;--card:rgba(255,255,255,.78);--bd:#f0e6e4}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;min-height:100vh;background:radial-gradient(500px 400px at 0% 0%,#ffd9df,transparent 70%),radial-gradient(500px 400px at 100% 20%,#d6f1e6,transparent 70%),radial-gradient(600px 500px at 50% 100%,#d8ecfb,transparent 70%),#fff6f1;background-attachment:fixed}
.w{max-width:980px;margin:0 auto;padding:14px 14px 100px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.hd small{font-size:11px;letter-spacing:2px;color:var(--mu);font-weight:700}
.hd h1{margin:2px 0 0;font-size:26px;font-weight:900;letter-spacing:-.5px}.hd h1 b{color:var(--red)}.jp{font-size:11px;font-weight:700;color:var(--mu);letter-spacing:3px;margin-left:6px}
.pill{display:inline-block;padding:7px 14px;border-radius:99px;font-size:11px;font-weight:800;background:#fff;box-shadow:0 4px 14px rgba(239,59,79,.18);color:var(--red)}
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.c{background:var(--card);backdrop-filter:blur(12px);border:1px solid #fff;border-radius:26px;padding:16px;box-shadow:0 10px 30px rgba(120,80,90,.09)}
.c h3{margin:0 0 12px;font-size:12px;font-weight:800;color:var(--mu);letter-spacing:1.2px;text-transform:uppercase;display:flex;align-items:center;gap:8px}.c h3:after{content:"";flex:1;height:1px;background:var(--bd)}
.mascard{grid-column:1/3;grid-row:1/3;position:relative;overflow:visible;background:linear-gradient(160deg,#ffc9d3,#ffe3cf 55%,#fff1d6);display:flex;flex-direction:column;justify-content:flex-end;min-height:440px;padding-top:0}
.sun{position:absolute;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,#ff5a6b,#ef3b4f);right:-24px;top:40px;opacity:.9;box-shadow:0 0 0 14px rgba(255,255,255,.28)}
.kj{position:absolute;left:14px;top:16px;writing-mode:vertical-rl;font-size:30px;font-weight:900;color:rgba(239,59,79,.28);letter-spacing:6px}
.mas{position:relative;width:88%;max-width:340px;margin:-40px auto 0;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite;filter:drop-shadow(0 14px 14px rgba(120,60,70,.2))}
.mas img{display:block;width:100%;height:auto}.lids{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 4.6s infinite}.lid.r{animation-delay:.03s}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@keyframes sway{0%,100%{transform:rotate(-.7deg) scale(1)}50%{transform:rotate(.7deg) scale(1.012)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(1.5deg)}}
.mas[data-e=cheer]{animation:hop .7s ease-in-out 3}.mas[data-e=worry]{animation:none;transform:rotate(-2.5deg)}.mas[data-e=wow]{animation:none;transform:scale(1.04)}
.mas[data-e=sleepy] .lid{animation:none;transform:scaleY(1)}.mas[data-e=wink] .lid.r{animation:none;transform:scaleY(1)}
.mas[data-e=happy] .lid,.mas[data-e=eat] .lid{animation-duration:2.4s}
.fx{position:absolute;right:2%;top:6%;font-size:34px;animation:pop 1.6s ease-in-out infinite;pointer-events:none}@keyframes pop{50%{transform:translateY(-8px) scale(1.12)}}
.av{flex:none;border-radius:50%;background:var(--src) 55% 28%/240% no-repeat,#ffd9df;border:2px solid #fff;box-shadow:0 4px 12px rgba(239,59,79,.25);position:relative}.av.big{width:62px;height:62px}.av.sm{width:34px;height:34px}
.av i{position:absolute;right:-8px;top:-8px;font-style:normal;font-size:18px}.av[data-e=cheer]{animation:hop .7s ease-in-out 3}
.chhd{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--bd)}.chhd b{display:block;font-size:17px}.chhd small{font-size:11px;color:var(--gr);font-weight:700}
.rw{display:flex;gap:8px;align-items:flex-end;align-self:flex-start;max-width:92%}.rw .b{max-width:none}
.pt{position:absolute;width:12px;height:12px;border-radius:12px 0;background:#ffb3c1;animation:fall 7s linear infinite}.pt:nth-of-type(1){left:20%;top:-6px}.pt:nth-of-type(2){left:55%;top:-6px;animation-delay:2s}.pt:nth-of-type(3){left:80%;top:-6px;animation-delay:4s}@keyframes fall{to{transform:translate(-40px,420px) rotate(300deg);opacity:0}}
.who{position:absolute;right:16px;top:16px;background:#fff;padding:8px 14px;border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.08);text-align:right}.who b{display:block;font-size:16px}.who small{font-size:10px;color:var(--mu)}
.bub{position:relative;margin-top:6px;background:#fff;padding:12px 15px;border-radius:20px;font-size:14px;line-height:1.45;box-shadow:0 8px 20px rgba(120,60,70,.12)}.bub:before{content:"";position:absolute;top:-8px;left:50%;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
.k1{grid-column:3}.k2{grid-column:4}.nu{grid-column:3/5}.sp2{grid-column:1/3}.lg{grid-column:3/5}
@media(max-width:700px){.bento{grid-template-columns:1fr 1fr}.mascard{grid-column:1/3;grid-row:auto;min-height:400px}.k1,.k2{grid-column:auto}.nu,.sp2,.lg{grid-column:1/3}}
.ring{position:relative;width:150px;height:150px;margin:0 auto}.ring svg{transform:rotate(-90deg)}.ring .m{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring b{font-size:30px;font-weight:900}.ring span{font-size:11px;color:var(--mu)}
.bar{height:10px;background:#f3ebe8;border-radius:10px;overflow:hidden;margin:5px 0 12px}.bar i{display:block;height:100%;border-radius:10px;transition:width .7s;background-image:linear-gradient(90deg,rgba(255,255,255,.0),rgba(255,255,255,.4))}
.row{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.mu{color:var(--mu)}
.big{font-size:30px;font-weight:900;color:var(--red);text-align:center}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:var(--pk);color:#c2273b;margin:2px}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;margin-bottom:8px;border-radius:16px;background:#fff;font-size:13px}.item small{color:var(--mu)}.x{background:none;border:0;cursor:pointer;color:var(--mu);font-size:17px}
.spark{display:flex;align-items:flex-end;gap:8px;height:110px;margin-bottom:20px}.spark div{flex:1;background:linear-gradient(var(--sky),#9bdcf7);border-radius:10px;position:relative;min-height:6px}.spark small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mu)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-radius:99px;box-shadow:0 10px 30px rgba(120,60,70,.2);z-index:5}
nav button{border:0;background:none;padding:11px 20px;border-radius:99px;font-weight:800;font-size:13px;cursor:pointer;color:var(--mu)}nav button.on{background:linear-gradient(135deg,#ff6b7d,var(--red));color:#fff;box-shadow:0 6px 14px rgba(239,59,79,.35)}
.tab{display:none}.tab.on{display:block}
#chat{height:50vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.b{max-width:85%;padding:10px 14px;border-radius:20px;font-size:14px;line-height:1.45;white-space:pre-wrap}.b.u{align-self:flex-end;background:linear-gradient(135deg,#ff6b7d,var(--red));color:#fff;border-bottom-right-radius:6px}.b.a{align-self:flex-start;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.06);border-bottom-left-radius:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{background:#fff;border-radius:99px;padding:8px 13px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.06)}
.inp{display:flex;gap:8px}.inp input,.t{border:1px solid var(--bd);border-radius:99px;padding:12px 16px;font-size:15px;background:#fff;min-width:0}.inp input{flex:1}
.go{border:0;border-radius:99px;padding:0 22px;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff6b7d,var(--red));cursor:pointer;box-shadow:0 6px 14px rgba(239,59,79,.3)}.go[disabled]{opacity:.5}
.pers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.per{padding:16px 4px;text-align:center;border-radius:20px;background:#fff;cursor:pointer;font-weight:700;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.05)}.per b{display:block;font-size:26px}.per.on{background:linear-gradient(135deg,#ff6b7d,var(--red));color:#fff}
</style></head><body><div class="w">

<div class="c nu"><h3>Nutrisi</h3><div class="row"><span>🌿 Serat</span><span id="fv"></span></div><div class="bar"><i id="fbar" style="background-color:var(--gr);width:0"></i></div><div class="row"><span>🥩 Protein</span><span id="pv"></span></div><div class="bar"><i id="pbar" style="background-color:var(--red);width:0"></i></div><div class="row"><span>🍚 Karbo</span><span id="cv"></span></div><div class="bar"><i id="cbar" style="background-color:var(--sky);width:0"></i></div><div class="row"><span>🥑 Lemak</span><span id="lv"></span></div><div class="bar" style="margin-bottom:0"><i id="lbar" style="background-color:var(--or);width:0"></i></div></div>
<div class="c sp2"><h3>7 hari</h3><div class="spark" id="sp"></div></div>
<div class="c lg"><h3>Log hari ini</h3><div id="log"></div></div></div></section>
<section class="tab" id="t1"><div class="c"><div class="chhd"><div class="av big" id="av"><i id="fx2"></i></div><div><b>Tantri</b><small>● online · asisten dietmu</small></div></div><div id="chat"></div>
<div class="chips"><span class="chip" data-q="Aku mau ngemil, enaknya apa?">🍙 Mau ngemil</span><span class="chip" data-q="Rekap hari ini dan sisa serat berapa?">📋 Rekap</span><span class="chip" data-q="Saranin menu buka puasa tinggi serat">🥗 Menu serat</span></div>
<div class="inp"><input id="in" placeholder="makan nasi goreng, lari 30 menit…" autocomplete="off"><button class="go" id="send">Kirim</button></div></div></section>
<section class="tab" id="t2"><div class="c"><h3>Ekspor laporan PDF</h3><div class="pers" id="pers"></div><button class="go" id="exp" style="width:100%;padding:15px;margin-top:16px">⬇ Ekspor PDF</button><div class="mu" id="em" style="font-size:12px;margin-top:6px"></div></div>
<div class="c" style="margin-top:14px"><h3>Profil &amp; target</h3><div id="prof" style="font-size:13px;line-height:1.8"></div></div></section>
</div>
<nav><button class="on" data-t="0">🏠 Beranda</button><button data-t="1">💬 Tantri</button><button data-t="2">📄 Laporan</button></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const API="https://script.google.com/macros/s/AKfycbygBcy2aWLbB4z0OD-0xVc-F_ajZYirfAOHz2ALHR6BGtzAl40JmdF0dD2DpHvzxr0giw/exec",TOKEN="040925";
const run=(fn,...a)=>fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args:a,token:TOKEN})}).then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error);return j.data});
let S={log:[],chat:[],profile:{},fast:{a:'12:00',b:'20:00'}},busy=false,sel=7;
const dk=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const sum=(a,f)=>a.reduce((s,x)=>s+(+x[f]||0),0),foods=k=>S.log.filter(x=>x.d===k&&x.type==='makan'),acts=k=>S.log.filter(x=>x.d===k&&x.type==='aktivitas');
// ---- maskot ----
const K='stroke="#3a2e2b" stroke-width="3.2" fill="none" stroke-linecap="round"';
const eye=(x,w=9,h=11)=>`<ellipse cx="${x}" cy="102" rx="${w}" ry="${h}" fill="#3a2e2b"/><circle cx="${x+3}" cy="98" r="3.6" fill="#fff"/><circle cx="${x-3}" cy="106" r="1.8" fill="#fff"/>`;
const arc=(x)=>`<path d="M${x-9} 104q9-13 18 0" ${K}/>`;
const EM={
 idle:[eye(78)+eye(122),`<path d="M90 124q10 8 20 0" ${K}/>`],
 happy:[arc(78)+arc(122),`<path d="M86 120q14 18 28 0z" fill="#c0392b" stroke="#1a1f2b" stroke-width="3"/>`],
 cheer:[arc(78)+arc(122),`<path d="M84 118q16 26 32 0z" fill="#c0392b" stroke="#1a1f2b" stroke-width="3"/><path d="M62 84l-8-10M138 84l8-10" ${K}/>`],
 eat:[arc(78)+arc(122),`<ellipse cx="100" cy="124" rx="8" ry="6" fill="#c0392b" stroke="#1a1f2b" stroke-width="3"/>`],
 wow:[eye(78,11,14)+eye(122,11,14),`<ellipse cx="100" cy="127" rx="6" ry="9" fill="#c0392b" stroke="#1a1f2b" stroke-width="3"/>`],
 worry:[eye(78)+eye(122)+`<path d="M66 86l22-6M134 86l-22-6" ${K}/>`,`<path d="M90 130q10-9 20 0" ${K}/>`],
 sleepy:[`<path d="M68 104h20M112 104h20" ${K}/><text x="146" y="70" font-size="18" font-weight="900" fill="#fff">Z</text>`,`<ellipse cx="100" cy="126" rx="5" ry="4" fill="#c0392b" stroke="#1a1f2b" stroke-width="2.5"/>`],
 wink:[eye(78)+`<path d="M113 104q9-13 18 0" ${K}/>`,`<path d="M88 121q12 12 24 0" ${K}/>`]};
const FX={idle:'',happy:'✨',cheer:'🎉',eat:'🍙',wow:'❗',worry:'💧',sleepy:'💤',wink:'💖'};function face(e){e=FX[e]!==undefined?e:'idle';$('mas').dataset.e=e;$('fx').textContent=FX[e];$('av').dataset.e=e;$('fx2').textContent=FX[e]}
function say(t,e){$('say').textContent=t;face(e)}
// ---- hitung ----
function T(){const p=S.profile;let k=2000;if(p.weight&&p.height&&p.age){const b=10*p.weight+6.25*p.height-5*p.age+(p.sex==='f'?-161:5);let t=b*({rendah:1.3,sedang:1.5,tinggi:1.7}[p.activity]||1.4);t+=p.goal==='naik'?300:p.goal==='jaga'?0:-400;k=Math.round(Math.max(t,p.sex==='f'?1200:1500))}return{k,fiber:Math.max(25,Math.round(k/1000*14)),pro:Math.round(k*.25/4),carb:Math.round(k*.45/4),fat:Math.round(k*.3/9)}}
function fs(){const n=new Date(),m=n.getHours()*60+n.getMinutes(),f=s=>{const[h,mm]=s.split(':');return+h*60+ +mm},a=f(S.fast.a),b=f(S.fast.b),w=((b-a)+1440)%1440||1440,inW=a<=b?(m>=a&&m<b):(m>=a||m<b),fm=x=>{x=(x+1440)%1440;return Math.floor(x/60)+'j '+String(x%60).padStart(2,'0')+'m'};return inW?{inW,t:fm(b-m),l:'sampai puasa mulai',p:((m-a+1440)%1440)/w*100}:{inW,t:fm(a-m),l:'sampai boleh makan',p:((m-b+1440)%1440)/(1440-w)*100}}
function render(){const k=dk(),F=foods(k),A=acts(k),t=T(),kc=Math.round(sum(F,'kcal')),br=Math.round(sum(A,'kcal'));
 $('date').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();
 $('kc').textContent=kc;$('kt').textContent='/ '+t.k+' kkal';$('burn').textContent='🔥 '+br+' kkal';$('rg').style.strokeDashoffset=396*(1-Math.min(1,(kc-br)/t.k));
 [['fiber','f','fiber'],['pro','p','protein'],['carb','c','carbs'],['fat','l','fat']].forEach(([a,i,f])=>{const v=Math.round(sum(F,f));$(i+'v').textContent=v+' / '+t[a]+' g';$(i+'bar').style.width=Math.min(100,v/t[a]*100)+'%'});
 const s=fs();$('fc').textContent=s.t;$('fs').textContent=s.l;$('fb').style.width=s.p+'%';$('st').textContent=s.inW?'🍱 JENDELA MAKAN':'⚡ MODE PUASA';
 $('log').innerHTML=(F.length+A.length)?F.concat(A).map(x=>`<div class="item"><div>${x.type==='makan'?'🍽':'🏃'} ${esc(x.name)}<br><small>${x.time} · ${x.type==='makan'?'serat '+x.fiber+'g':x.min+' menit'}</small></div><div><b>${x.type==='makan'?x.kcal:'−'+x.kcal}</b> <button class="x" onclick="del('${x.id}')">×</button></div></div>`).join(''):'<div class="mu" style="font-size:13px">Belum ada catatan. Ngobrol dulu di tab Asisten!</div>';
 let h='';for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);h+=`<div style="height:${Math.max(4,Math.min(100,sum(foods(dk(d)),'kcal')/t.k*100))}%"><small>${d.getDate()}</small></div>`}$('sp').innerHTML=h;
 const p=S.profile;$('prof').innerHTML=p.age?`${p.sex==='f'?'Perempuan':'Laki-laki'}, ${p.age} th · ${p.weight} kg · ${p.height} cm<br>Aktivitas ${p.activity||'-'} · tujuan ${p.goal||'-'}<br>Target <b>${t.k} kkal</b> · serat <b>${t.fiber} g</b> · protein ${t.pro} g`:'Belum lengkap, biar Tantri kenalan dulu lewat chat 😉'}
async function del(id){S.log=S.log.filter(x=>x.id!==id);render();run('delLog',id)}
function bub(t,c){const b=document.createElement('div');b.className='b '+c;b.textContent=t;if(c==='a'){const r=document.createElement('div');r.className='rw';r.innerHTML='<div class="av sm"></div>';r.appendChild(b);$('chat').appendChild(r)}else $('chat').appendChild(b);$('chat').scrollTop=1e9;return b}
function parseAI(raw){let t=String(raw||'').trim();try{return fix(JSON.parse(t))}catch(e){}const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a){try{return fix(JSON.parse(t.slice(a,b+1)))}catch(e){}}return{reply:t||'Hmm, aku belum paham, coba ulangi ya.',emotion:'idle'}}
function fix(r){if(Array.isArray(r))r=r[0]||{};r.reply=String(r.reply||'Oke, sudah kucatat ya!');return r}
async function send(text){if(!text||busy)return;busy=true;$('send').disabled=true;$('in').value='';S.chat.push({role:'user',content:text});bub(text,'u');const w=bub('…','a');say('Hmm, bentar ya…','wow');
 try{const k=dk(),t=T(),n=new Date(),hm=n.toTimeString().slice(0,5);
  const pr=`Kamu Tantri, maskot asisten diet cewek berhijab bergaya anime yang ceria, sopan, imut, ekspresif, bahasa Indonesia santai (1-4 kalimat, emoji boleh). Pengguna intermittent fasting, target ${t.k} kkal & serat ${t.fiber} g/hari. Profil: ${JSON.stringify(S.profile)}. Jendela makan ${S.fast.a}-${S.fast.b}, sekarang ${hm}. Hari ini makan: ${JSON.stringify(foods(k).map(f=>[f.name,f.kcal,f.fiber]))}, aktivitas: ${JSON.stringify(acts(k).map(a=>[a.name,a.kcal]))}.
Jika profil belum lengkap (sex m/f, age, weight kg, height cm, activity rendah/sedang/tinggi, goal turun/jaga/naik) kenalan lewat obrolan, tanya 1-2 hal per balasan, bukan formulir. Makanan/minuman yang SUDAH dimakan -> estimasi porsi wajar Indonesia di foods. Aktivitas -> estimasi kalori terbakar sesuai berat badan di acts. Minta saran jajan -> beri 2-3 opsi tinggi serat sesuai sisa kalori & jendela puasa, jangan dicatat.
Balas HANYA JSON: {"reply":str,"emotion":"idle|happy|cheer|eat|wow|worry|sleepy|wink","profile":{field baru saja atau kosong},"foods":[{"name","kcal","fiber","protein","carbs","fat"}],"acts":[{"name","kcal","min"}],"fast":{"a":"HH:MM","b":"HH:MM"} atau null}. Angka number.
Riwayat: ${S.chat.slice(-9,-1).map(m=>m.role+': '+m.content).join(' | ')}
Pesan baru: ${text}`;
  const raw=await run('ai',pr),r=parseAI(raw);
  Object.assign(S.profile,r.profile||{});const rows=[];
  (r.foods||[]).forEach(f=>rows.push({id:crypto.randomUUID(),d:k,time:hm,type:'makan',name:f.name,kcal:+f.kcal||0,fiber:+f.fiber||0,protein:+f.protein||0,carbs:+f.carbs||0,fat:+f.fat||0,min:0}));
  (r.acts||[]).forEach(a=>rows.push({id:crypto.randomUUID(),d:k,time:hm,type:'aktivitas',name:a.name,kcal:+a.kcal||0,fiber:0,protein:0,carbs:0,fat:0,min:+a.min||0}));
  S.log.push(...rows);if(rows.length)run('addLog',rows);if(r.profile&&Object.keys(r.profile).length)run('setKV','profile',JSON.stringify(S.profile));
  if(r.fast&&r.fast.a&&r.fast.b){S.fast=r.fast;$('e1').value=S.fast.a;$('e2').value=S.fast.b;run('setKV','fast',JSON.stringify(S.fast))}
  const add=rows.map(x=>(x.type==='makan'?'✅ '+x.name+' '+x.kcal+' kkal':'🔥 '+x.name+' −'+x.kcal+' kkal')).join('\n'),msg=r.reply+(add?'\n\n'+add:'');
  w.textContent=msg;S.chat.push({role:'assistant',content:msg});run('addChat','user',text);run('addChat','assistant',msg);say(r.reply.slice(0,110),r.emotion||'happy')
 }catch(e){w.textContent='Aduh, Tantri lagi gangguan 🙏 Coba lagi ya.\n('+String(e&&e.message||e).slice(0,170)+')';S.chat.pop();say('Maaf ya, ada gangguan…','worry')}
 busy=false;$('send').disabled=false;render()}
$('send').onclick=()=>send($('in').value.trim());$('in').onkeydown=e=>{if(e.key==='Enter')send($('in').value.trim())};
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>send(c.dataset.q));
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',i==b.dataset.t))});
$('e1').onchange=$('e2').onchange=()=>{S.fast={a:$('e1').value,b:$('e2').value};run('setKV','fast',JSON.stringify(S.fast));render()};
const PER=[[5,'5','hari'],[7,'7','hari'],[30,'30','hari'],[90,'3','bulan'],[180,'6','bulan'],[365,'1','tahun']];
$('pers').innerHTML=PER.map(p=>`<div class="per${p[0]==sel?' on':''}" data-d="${p[0]}"><b>${p[1]}</b>${p[2]}</div>`).join('');
document.querySelectorAll('.per').forEach(e=>e.onclick=()=>{sel=+e.dataset.d;document.querySelectorAll('.per').forEach(x=>x.classList.toggle('on',x===e))});
$('exp').onclick=()=>{try{const doc=new window.jspdf.jsPDF(),t=T();let y=20;doc.setFontSize(18);doc.text('NutriPilot - Laporan '+sel+' hari',14,y);y+=7;doc.setFontSize(9);doc.text('Dibuat '+new Date().toLocaleDateString('id-ID')+' | Target '+t.k+' kkal, serat '+t.fiber+' g',14,y);y+=10;
 const rows=[];let tk=0,tb=0,tf=0,n=0;for(let i=sel-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dk(d),F=foods(k),A=acts(k);if(!F.length&&!A.length)continue;const kc=Math.round(sum(F,'kcal')),b=Math.round(sum(A,'kcal')),f=Math.round(sum(F,'fiber'));n++;tk+=kc;tb+=b;tf+=f;rows.push([k,kc,b,f,Math.round(sum(F,'protein')),F.map(x=>x.name).join(', ').slice(0,60)])}
 doc.setFontSize(11);doc.text(n?`Rata-rata/hari: ${Math.round(tk/n)} kkal | terbakar ${Math.round(tb/n)} | serat ${Math.round(tf/n)} g (${n} hari tercatat)`:'Belum ada data pada periode ini.',14,y);y+=9;
 const X=[14,42,58,76,92,106];doc.setFontSize(9);doc.setFont(undefined,'bold');['Tanggal','Kkal','Bakar','Serat','Prot','Makanan'].forEach((h,i)=>doc.text(h,X[i],y));doc.setFont(undefined,'normal');y+=6;
 rows.forEach(r=>{if(y>280){doc.addPage();y=20}r.forEach((c,i)=>doc.text(String(c),X[i],y));y+=6});doc.save('laporan-diet-'+sel+'-hari.pdf');$('em').textContent=''}catch(e){$('em').textContent='Gagal membuat PDF, coba lagi.'}};
document.documentElement.style.setProperty('--src','url('+$('mas').querySelector('img').src+')');face('idle');
run('load').then(d=>{S=d;$('e1').value=S.fast.a;$('e2').value=S.fast.b;
 if(!S.chat.length)S.chat.push({role:'assistant',content:'Halo, aku Tantri! 🌸 Aku bakal jadi partner dietmu. Kenalan dulu yuk, cerita santai aja: umur, jenis kelamin, tinggi & berat badanmu berapa, dan sehari-hari lebih banyak duduk atau gerak?'});
 S.chat.forEach(m=>bub(m.content,m.role==='user'?'u':'a'));render();const s=fs();
 say(S.profile.age?(s.inW?'Jendela makan lagi buka! Ingat sayur & buah ya 🥦':'Lagi puasa, semangat! Kamu pasti kuat 💪'):'Halo! Ayo kenalan dulu di tab Asisten 🌸',S.profile.age?(s.inW?'happy':'cheer'):'wink')}).catch(()=>say('Gagal terhubung ke spreadsheet. Cek deploy Code.gs ya.','worry'));
setInterval(render,30000);
</script></body></html>
